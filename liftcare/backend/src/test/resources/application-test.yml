server:
  port: 0

spring:
  application:
    name: liftcare-backend-test
  datasource:
    url: jdbc:h2:mem:liftcare_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: LiftCareTestHikariPool
      maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        boot:
          allow_jdbc_metadata_access: true
        format_sql: true
    open-in-view: false
  flyway:
    enabled: false

liftcare:
  frontend:
    origin: http://localhost:5173
  environment: test
  jwt:
    secret: test-secret-key-for-liftcare-unit-testing-at-least-256-bits-long-32-bytes
    expiration-ms: 3600000
