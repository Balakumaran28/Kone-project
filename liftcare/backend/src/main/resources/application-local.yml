server:
  port: 8080

spring:
  application:
    name: liftcare-backend-local
  datasource:
    url: jdbc:h2:file:./data/liftcare_local_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      pool-name: LiftCareLocalHikariPool
      maximum-pool-size: 10
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        boot:
          allow_jdbc_metadata_access: true
        format_sql: false
    open-in-view: false
  flyway:
    enabled: false

liftcare:
  frontend:
    origin: http://localhost:5173
  environment: local-dev
  node-id: building-local-node-01
  jwt:
    secret: liftcare-development-secret-key-must-be-at-least-256-bits-long-32-bytes
    expiration-ms: 86400000

logging:
  level:
    root: INFO
    com.liftcare: INFO
    org.springframework.web: INFO
