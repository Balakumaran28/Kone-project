server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: liftcare-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/liftcare_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: LiftCareHikariPool
      connection-timeout: 2000
      initialization-fail-timeout: -1
      minimum-idle: 0
      maximum-pool-size: 10
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false
        format_sql: true
    open-in-view: false
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration

# Custom LiftCare configuration
liftcare:
  frontend:
    origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  environment: ${LIFTCARE_ENV:development}
  node-id: ${LIFTCARE_NODE_ID:building-local-node-01}
  jwt:
    secret: ${JWT_SECRET:liftcare-development-secret-key-must-be-at-least-256-bits-long-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    root: INFO
    com.liftcare: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
